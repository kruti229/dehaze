name: sots_indoor

datasets:
  train:
    dataroot_LQ: data/sots/indoor/train/hazy
    dataroot_GT: data/sots/indoor/train/clear
    batch_size: 4
    patch_size: 256
    use_shuffle: true
    n_workers: 2

  val:
    dataroot_LQ: data/sots/indoor/val/hazy
    dataroot_GT: data/sots/indoor/val/clear
    batch_size: 1
    patch_size: 256
    use_shuffle: false
    n_workers: 0

  test:
    dataroot_LQ: data/sots/indoor/test/hazy
    dataroot_GT: data/sots/indoor/test/clear
    batch_size: 1
    patch_size: null
    use_shuffle: false
    n_workers: 0

network_encoder:
  backbone: convnext_small
  pretrained: true

network_L:
  implicit_channels: 192
  latent_channels: 32
  cee_channels: 64

network_mapper:
  width: 96
  num_blocks: 10
  expansion: 2
  use_se: true

network_G:
  which_model: ConditionalNAFNet
  setting:
    img_channel: 32
    width: 64
    middle_blk_num: 8
    enc_blk_nums: [1, 1, 1]
    dec_blk_nums: [1, 1, 1]

fdaa:
  channels: 32
  num_heads: 4
  low_freq_ratio: 0.25

hag:
  t_max: 16
  min_steps: 4
  use_hag: true

physical:
  use_physical_guidance: true
  base_ch: 32
  t_min: 0.05

stage2_translator:
  width: 64
  num_blocks: 6
  residual_scale: 0.5
  epochs: 300
  lr: 2.0e-4
  min_lr: 1.0e-6
  val_freq: 25
  save_margin: 0.0

train:
  seed: 42

  resume_stage1: false

  stage1_epochs: 700
  stage2_warmup_epochs: 300

  stage2_residual_scale: 1.0

  stage2_eta_candidates: [0.0, 0.03, 0.05, 0.08, 0.10, 0.15, 0.20, 0.30, 0.50, 0.75, 1.0]
  stage2_save_margin: 0.0

  lr_stage1: 5.0e-5
  lr_stage2: 3.0e-5
  stage2_mapper_lr: 1.0e-5
  fdaa_lr: 5.0e-6
  hag_lr: 1.0e-5

  beta1: 0.9
  beta2: 0.99
  weight_decay: 1.0e-4

  min_lr_stage1: 1.0e-6
  min_lr_stage2: 1.0e-6

  latent_clip: 3.0
  grad_clip: 1.0

  val_freq: 25
  save_freq: 50

  merged_checkpoint_name: final_best.pth

loss:
  lambda_img: 1.0
  lambda_lat: 0.5

  lambda_dehaze_recon: 2.5
  lambda_hazy_recon: 0.0
  lambda_clean_recon: 0.2
  lambda_cross: 0.5

  lambda_z_align: 1.2
  lambda_cee_align: 0.0

  lambda_ssim: 0.35
  lambda_edge: 0.03
  lambda_hsv: 0.20
  lambda_chroma: 0.25
  lambda_gray_penalty: 0.08
  lambda_freq: 0.02
  lambda_tv: 0.0003
  lambda_perc: 0.0

  lambda_phy: 0.01
  lambda_t_smooth: 0.0005

  lambda_focal: 0.2
  lambda_freq_prior: 0.01
  lambda_asm: 0.0
  lambda_atm: 0.0

  lambda_stage2_img: 1.0
  lambda_stage2_ssim: 0.35
  lambda_stage2_edge: 0.10
  lambda_stage2_color: 0.05
  lambda_stage2_tv: 0.001
  lambda_stage2_freq: 0.05
  lambda_stage2_z: 0.05
  lambda_stage2_identity: 0.10

  lambda_stage2_translator_z: 1.0
  lambda_stage2_translator_img: 1.0
  lambda_stage2_translator_ssim: 0.20
  lambda_stage2_translator_hsv: 0.08
  lambda_stage2_translator_chroma: 0.10
  lambda_stage2_translator_gray: 0.03
  lambda_stage2_translator_delta: 0.01

test:
  use_color_fix: false

  min_chroma: 0.08
  chroma_blend: 0.70
  luma_blend: 0.10