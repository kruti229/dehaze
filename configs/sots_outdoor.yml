name: sots_indoor

datasets:
  train:
    dataroot_LQ: data/SOTS_raw/indoor/hazy
    dataroot_GT: data/SOTS_raw/indoor/clear
    batch_size: 4
    patch_size: 256
    use_shuffle: true
    n_workers: 2

  val:
    dataroot_LQ: data/SOTS_raw/indoor/hazy
    dataroot_GT: data/SOTS_raw/indoor/clear
    batch_size: 1
    patch_size: 256
    use_shuffle: false
    n_workers: 0

  test:
    dataroot_LQ: data/SOTS_raw/indoor/hazy
    dataroot_GT: data/SOTS_raw/indoor/clear
    batch_size: 1
    patch_size: 256
    use_shuffle: false
    n_workers: 0

network_encoder:
  backbone: convnext_small
  pretrained: true

network_pre:
  channels: 32

network_L:
  implicit_channels: 192
  latent_channels: 16
  cee_channels: 64

network_G:
  which_model: ConditionalNAFNet
  setting:
    img_channel: 16
    width: 64
    middle_blk_num: 8
    enc_blk_nums: [1, 1, 1]
    dec_blk_nums: [1, 1, 1]

fdaa:
  channels: 16
  num_heads: 4
  low_freq_ratio: 0.25

hag:
  t_max: 16
  min_steps: 4
  use_hag: false

sde:
  max_sigma: 20
  T: 16
  schedule: cosine

train:
  pre_epochs: 100
  stage1_epochs: 300
  stage2_epochs: 800
  lr_pre: 1.0e-4
  lr_stage1: 1.0e-4
  lr_stage2: 3.0e-5
  beta1: 0.9
  beta2: 0.99
  latent_clip: 3.0
  fixed_t: 8
  val_freq: 100
  save_freq: 200
  use_perceptual: false

loss:
  lambda_img: 1.0
  lambda_lat: 0.1
  lambda_freq: 0.2
  lambda_freq_prior: 0.01
  lambda_perc: 0.0
