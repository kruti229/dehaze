name: nh_haze

datasets:
  train:
    dataroot_LQ: data/real_raw/NH-Haze/train/hazy
    dataroot_GT: data/real_raw/NH-Haze/train/clear
    batch_size: 2
    patch_size: 256
    use_shuffle: true
    n_workers: 2

  val:
    dataroot_LQ: data/real_raw/NH-Haze/val/hazy
    dataroot_GT: data/real_raw/NH-Haze/val/clear
    batch_size: 1
    patch_size: 256
    use_shuffle: false
    n_workers: 0

  test:
    dataroot_LQ: data/real_raw/NH-Haze/test/hazy
    dataroot_GT: data/real_raw/NH-Haze/test/clear
    batch_size: 1
    patch_size: null
    use_shuffle: false
    n_workers: 0

network_pre:
  channels: 32

network_encoder:
  backbone: convnext_small
  pretrained: true

network_L:
  implicit_channels: 192
  latent_channels: 16
  cee_channels: 64

network_G:
  which_model: ConditionalNAFNet
  setting:
    img_channel: 16
    width: 96
    middle_blk_num: 12
    enc_blk_nums: [2, 2, 4]
    dec_blk_nums: [2, 2, 2]

fdaa:
  channels: 16
  num_heads: 4
  low_freq_ratio: 0.25

hag:
  t_max: 16
  min_steps: 4
  use_hag: true

sde:
  max_sigma: 20
  T: 16
  schedule: cosine

train:
  stage1_epochs: 500
  stage2_warmup_epochs: 1000
  lr_stage1: 1.0e-4
  lr_stage2: 3.0e-5
  beta1: 0.9
  beta2: 0.99
  latent_clip: 3.0
  val_freq: 50
  save_freq: 100
  merged_checkpoint_name: final_best.pth
  alpha_schedule:
    boundaries: [600, 850]
    values: [1.0, 0.75, 0.5]
  scheduler:
    type: cosine
    min_lr: 5.0e-6

loss:
  lambda_img: 1.0
  lambda_lat: 0.5
  lambda_freq: 0.2
  lambda_freq_prior: 0.01
  lambda_perc: 0.0
  lambda_ssim: 0.15
  lambda_edge: 0.05
  lambda_ctx: 0.05