name: nh_haze

datasets:
  train:
    dataroot_LQ: data/real_raw/NH-Haze/train/hazy
    dataroot_GT: data/real_raw/NH-Haze/train/clear
    batch_size: 2
    patch_size: 320
    use_shuffle: true
    n_workers: 2
  val:
    dataroot_LQ: data/real_raw/NH-Haze/val/hazy
    dataroot_GT: data/real_raw/NH-Haze/val/clear
    batch_size: 1
    patch_size: 256
    use_shuffle: false
    n_workers: 0
  test:
    dataroot_LQ: data/real_raw/NH-Haze/test/hazy
    dataroot_GT: data/real_raw/NH-Haze/test/clear
    batch_size: 1
    patch_size: null
    use_shuffle: false
    n_workers: 0

network_pre:
  channels: 32

network_encoder:
  backbone: convnext_small
  pretrained: true

network_L:
  implicit_channels: 192
  latent_channels: 16
  cee_channels: 64

network_G:
  which_model: ConditionalNAFNet
  setting:
    img_channel: 16
    width: 64
    middle_blk_num: 8
    enc_blk_nums: [1, 1, 1]
    dec_blk_nums: [1, 1, 1]

fdaa:
  channels: 16
  num_heads: 4
  low_freq_ratio: 0.25

hag:
  t_max: 16
  min_steps: 4
  use_hag: true

sde:
  max_sigma: 20
  T: 16
  schedule: cosine

train:
  predehazer_epochs: 200
  stage1_epochs: 500
  stage2_warmup_epochs: 600
  stage2_finetune_epochs: 0
  lr_predehazer: 1.0e-4
  lr_stage1: 1.0e-4
  lr_stage2: 3.0e-5
  stage2_hag_start_epoch: 200
  stage2_hazy_only_epoch: 500
  stage2_codec_unfreeze_epoch: 540
  stage2_codec_lr: 1.0e-5
  merged_checkpoint_name: final_best.pth
  beta1: 0.9
  beta2: 0.99
  latent_clip: 3.0
  fixed_t: 8
  val_freq: 50
  save_freq: 100

loss:
  lambda_img: 1.0
  lambda_lat: 0.5
  lambda_freq: 0.2
  lambda_freq_prior: 0.01
  lambda_perc: 0.0
  lambda_ssim: 0.1
  lambda_ctx: 0.05
